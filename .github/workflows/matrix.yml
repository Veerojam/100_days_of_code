name: Matrix Demo
on: push
jobs:
  build:
    strategy:
      matrix: # any different values (node-version, operating-system etc)
        node-version: [12, 14, 16] 
        operating-system: [ubuntu-latest, windows-latest] #will run in parallel
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
      - name: Build project
        run: npm run build